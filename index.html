<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival Desk — Specialty Arrival Report</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink:#10202b; --slate:#33505f; --paper:#eef1ee; --card:#fff;
    --rule:#c9d3d2; --kelp:#1d6b5f; --kelp-soft:#e2efe9;
    --alert:#b4441f; --alert-soft:#fbe9e2;
    --shadow:0 1px 0 var(--rule), 0 8px 24px -18px rgba(16,32,43,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Helvetica,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .sub{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    text-transform:uppercase;letter-spacing:.14em;color:var(--slate)}
  .pill{margin-left:auto;font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;
    text-transform:uppercase;color:var(--kelp);background:var(--kelp-soft);padding:6px 10px;border-radius:2px}
  .drop{border:2px dashed var(--rule);background:var(--card);border-radius:4px;
    padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--kelp);background:var(--kelp-soft)}
  .drop strong{display:block;font-size:17px;margin-bottom:4px}
  .drop span{color:var(--slate);font-size:13px}
  .bar{margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:12px 14px;font:12px/1.4 ui-monospace,monospace;color:var(--slate);display:none}
  .bar.on{display:block}
  .track{height:3px;background:var(--rule);margin-top:8px;border-radius:2px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--kelp);transition:width .3s}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;
    font-family:ui-monospace,monospace;color:var(--slate);margin:34px 0 12px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:4px;
    box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .card > .head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;
    border-bottom:1px solid var(--rule);background:linear-gradient(#fff,#f7faf8)}
  .prog{font-weight:700}
  .time{font:700 12px/1 ui-monospace,monospace;background:var(--ink);color:#fff;
    padding:5px 8px;border-radius:2px;letter-spacing:.05em}
  .flag{font:600 10px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;
    color:var(--alert);background:var(--alert-soft);padding:5px 8px;border-radius:2px}
  .head .sub{letter-spacing:.08em}
  .inc{display:flex;align-items:center;gap:6px;margin-left:auto;font:600 10px ui-monospace,monospace;
    text-transform:uppercase;letter-spacing:.08em;color:var(--slate);cursor:pointer}
  .quiet{font:600 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;
    color:var(--slate);background:var(--paper);padding:5px 8px;border-radius:2px}
  .body{padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  label{display:block;font:600 10px/1 ui-monospace,monospace;text-transform:uppercase;
    letter-spacing:.1em;color:var(--slate);margin-bottom:5px}
  input[type=text]{width:100%;padding:8px 9px;border:1px solid var(--rule);border-radius:3px;
    font:14px ui-monospace,monospace;background:#fbfcfb;color:var(--ink)}
  input.suspect{border-color:var(--alert);background:var(--alert-soft)}
  input:focus{outline:2px solid var(--kelp);outline-offset:-1px}
  .crop{margin-top:12px}
  .crop img{width:100%;border:1px solid var(--rule);border-radius:3px;display:block;margin-top:6px}
  .crop summary{cursor:pointer;font:600 11px ui-monospace,monospace;color:var(--slate);
    text-transform:uppercase;letter-spacing:.08em}
  .acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule);background:#f7faf8}
  button{font:600 13px ui-sans-serif,system-ui;padding:9px 13px;border-radius:3px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink)}
  button:hover{opacity:.88}
  a.call{font:600 13px ui-sans-serif,system-ui;padding:9px 13px;border-radius:3px;
    border:1px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none}
  .notes{margin-top:12px;padding:10px 12px;background:var(--kelp-soft);border-left:3px solid var(--kelp);
    border-radius:0 3px 3px 0;font-size:13px}
  .notes b{display:block;font:600 10px/1.6 ui-monospace,monospace;text-transform:uppercase;
    letter-spacing:.1em;color:var(--kelp)}
  .notes ul{margin:6px 0 0;padding-left:18px}
  pre.mail{white-space:pre-wrap;background:#fbfcfb;border:1px solid var(--rule);border-radius:3px;
    padding:12px;font:13px/1.5 ui-monospace,monospace;max-height:220px;overflow:auto;margin:12px 0 0;display:none}
  pre.mail.on{display:block}
  .empty{color:var(--slate);font-size:14px;padding:18px;background:var(--card);
    border:1px dashed var(--rule);border-radius:4px}
  .seen{margin-top:10px;font:12px ui-monospace,monospace;color:var(--slate)}
  footer{margin-top:40px;font-size:12px;color:var(--slate);border-top:1px solid var(--rule);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Arrival Desk</h1>
    <span class="sub">Specialty Arrival Report → morning calls</span>
    <span class="pill">Offline · nothing leaves this device</span>
  </header>

  <div class="drop" id="drop">
    <strong>Drop today's report PDF here</strong>
    <span>or click to choose — you can add both reports at once</span>
    <input type="file" id="file" accept="application/pdf" multiple hidden>
  </div>

  <div class="bar" id="bar">
    <span id="status">Reading…</span>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div id="out"></div>
</div>

/* clock helpers — the report's header time is the source of truth */
function shift(t, mins){
  const m = String(t||"").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return t || "";
  let h = parseInt(m[1],10) % 12;
  if(/pm/i.test(m[3])) h += 12;
  let total = h*60 + parseInt(m[2],10) + mins;
  total = ((total % 1440) + 1440) % 1440;
  const hh = Math.floor(total/60), mm = total % 60;
  const ampm = hh >= 12 ? "PM" : "AM";
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${String(mm).padStart(2,"0")} ${ampm}`;
}
const minutes = t => { const m = String(t||"").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return 9999; let h = parseInt(m[1],10) % 12; if(/pm/i.test(m[3])) h += 12;
  return h*60 + parseInt(m[2],10); };

<p>Hello!</p>
<p>Thank you for purchasing the Ultimate VIP Tour! We are so excited to host you and your party on <b>{{date}}!</b></p>
<p>Attached is your complementary parking pass. If you are driving yourself to the park, you can present this pass as a print-out or on your phone to our parking attendants and they will direct you to the correct parking lot area. <b>The tour will check in to the side of the security arches. There will be a sign that states &ldquo;VIP Tour Meets Here&rdquo; with your guide in front of it</b>.</p>
<p><b>Check-in will begin at {{time}}, and the program will begin promptly after</b>. Please note that late arrival may result in missing components of the program that cannot be substituted or made up. If you anticipate any delays, please contact us as soon as possible.</p>
<p>Any participants under the age of 18 must have a paid adult accompany them to the program. There are no observers permitted.</p>
<p>Don&rsquo;t forget to bring your camera! This day will be full of picture-perfect moments and memories. You are welcome and encouraged to take photos throughout your experience. Your guide can take pictures with your camera/phone as well.</p>
<p>You are highly encouraged to bring your own pre-filled water bottles. You are also permitted to bring individually packaged snacks if you choose to do so. Please note that glass containers, Styrofoam, and disposable plastic straws and lids are not permitted for the health and safety of our animals. Guests must be over the age of 21 and present a valid ID (including a U.S. driver&rsquo;s license, a passport, or a military identification card) in order to obtain alcoholic beverages in the park.</p>
<p>If you have any additional questions or concerns, please do not hesitate to contact us directly at (210) 523-3608.</p>
<p>Sincerely,</p><table cellpadding="0" cellspacing="0" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#1a1a1a;border-collapse:collapse;margin-top:14px">

  uae: `<div style="font-family:Calibri,Arial,sans-serif;font-size:15px;color:#1a1a1a;line-height:1.5">
<p>Hello!</p>
<p>Thank you for purchasing the Ultimate Animal Experience! We are so excited to host you and your party on <b>{{date}}</b>.</p>
<p>Please be aware that you will be meeting your tour guide in our security building, via Employee Entrance Gate 3 and 4. This is our security checkpoint prior to entering the park. You will not need to purchase any type of parking pass. For your convenience, attached are directions to our employee entrance.</p>
<p><b><u>Please do not go to the main entrance of the park.</u></b> You will be asked to reroute to the employee entrance. If it helps, type in SeaWorld Human Resources into a GPS app and it will take you directly to the employee entrance.</p>
<p><b>Check-in will begin at 8:30 AM and the program will begin promptly at 8:45 AM</b>. Please note that late arrival may result in missing components of the program that cannot be substituted or made up. If you anticipate any delays, please contact us as soon as possible. At the conclusion of the tour, you will be escorted back to our employee entrance.</p>
<p>Any participants under the age of 18 must have a paid adult accompany them to the program. There are no observers permitted.</p>
<p>As a reminder, this program will include the immersive Beluga Swim program. <b>All participants must be 48&quot; or taller to participate.</b> You will be issued a wetsuit, swim shoes, and a towel to use during this program, but please remember to bring your swimsuit or any undergarments that you would prefer to wear underneath your wetsuit. <b>Participants must remove all jewelry, piercings, and hair accessories prior to entering the water.</b> A complimentary locker will be issued for the duration of the Beluga Swim for you to store your belongings.</p>
<p>Don&rsquo;t forget to bring your camera! This day will be full of picture-perfect moments and memories. You are welcome and encouraged to take photos throughout your experience. Please note that you will not be permitted to take your camera with you for the Beluga Swim.</p>
<p>You are <b>highly</b> encouraged to bring your own pre-filled water bottles. You are also permitted to bring individually packaged snacks if you choose to do so. Please note that glass containers, Styrofoam, and disposable plastic straws and lids are not permitted for the health and safety of our animals.</p>
<p>If you plan to visit the park after the conclusion of your tour, park admission is required and is not included in the purchase of your tour. For information and specials on tickets, please visit:<br>
<a href="https://seaworld.com/san-antonio/tickets/single-park-tickets/">https://seaworld.com/san-antonio/tickets/single-park-tickets/</a></p>
<p>If you have any additional questions or concerns, please do not hesitate to contact us directly at (210) 523-3608.</p>

<p>Hello,</p>
<p>Thank you so much for purchasing our Penguin Interaction on <b>{{date}} at {{time}}</b>. We are so excited to host you and your guests on this one-of-a-kind experience!</p>
<p><b>The tour will meet in front of the Animal Interaction Center (AIC)</b>, which is immediately to the right once you go through security at the main blue arches. Bypass the bag check line and show security your <b>ANIMAL PROGRAM PASS</b> (attached above) so they will let you through to the AIC. <b>Please arrive for check-in at {{checkin}} and no later than {{latest}}. The guide will walk the group over to our penguin building by {{walk}}. Late arrivals will be rescheduled to the next available time/date.</b></p>
<p>As a reminder, this is an immersive experience where you will spend part of your time inside of our Penguin Habitat. <b><u>All participants must be 48&quot; or taller to participate.</u></b> Any participants under the age of 18 must have a paid adult accompany them to the program. There are no observers permitted. Participants will be issued snow pants, a jacket, and snow boots to use during this program. These will be worn over the clothing you arrive in. <b>Participants must remove all jewelry, piercings, and hair accessories prior to entering the habitat.</b> You will be provided with access to a place to secure your belongings through the duration of the program.</p>
<p>Don&rsquo;t forget to bring your camera! This day will be full of picture-perfect moments and memories. You are welcome and encouraged to take photos throughout your experience.</p>
<p><b>Park admission is required and is not included in the purchase of your tour</b>. For information and specials on tickets, please visit:<br>
<a href="https://seaworld.com/san-antonio/tickets/single-park-tickets/">https://seaworld.com/san-antonio/tickets/single-park-tickets/</a></p>
<p>If you have any additional questions or concerns, please do not hesitate to contact us directly at (210) 523-3608.</p>

function htmlToText(html){
  const d = document.createElement("div");
  d.innerHTML = html.replace(/<\/p>/gi, "</p>\n").replace(/<br\s*\/?>/gi, "\n");
  return (d.innerText || d.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}

/* ---- .eml: a real draft file. Images become proper inline attachments, not data URIs ---- */
function buildEml(to, subject, html){
  const parts = [];
  const body = html.replace(/src="data:image\/png;base64,([^"]+)"/g, (_, data) => {
    let idx = parts.indexOf(data);
    if(idx === -1){ parts.push(data); idx = parts.length - 1; }
    return `src="cid:img${idx}"`;
  });
  const bnd = "----arrivaldesk" + Date.now();
  const wrap = str => str.replace(/(.{76})/g, "$1\r\n");
  let eml =
    `To: ${to || ""}\r\n` +
    `Subject: ${subject}\r\n` +
    `X-Unsent: 1\r\n` +                      // tells Outlook to open it as a draft, not a received message
    `MIME-Version: 1.0\r\n` +
    `Content-Type: multipart/related; type="text/html"; boundary="${bnd}"\r\n\r\n` +
    `--${bnd}\r\nContent-Type: text/html; charset="utf-8"\r\n` +
    `Content-Transfer-Encoding: 7bit\r\n\r\n<html><body>${body}</body></html>\r\n\r\n`;
  parts.forEach((data, i) => {
    eml += `--${bnd}\r\nContent-Type: image/png\r\nContent-Transfer-Encoding: base64\r\n` +
           `Content-ID: <img${i}>\r\nContent-Disposition: inline; filename="img${i}.png"\r\n\r\n` +
           wrap(data) + `\r\n\r\n`;
  });
  eml += `--${bnd}--\r\n`;
  return eml;
}
function downloadEml(name, to, subject, html){
  const blob = new Blob([buildEml(to, subject, html)], { type: "message/rfc822" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^\w.-]+/g, "_") + ".eml";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function copyRich(html, plain, btn){
  try{
    await navigator.clipboard.write([ new ClipboardItem({
      "text/html":  new Blob([html],  { type:"text/html" }),
      "text/plain": new Blob([plain], { type:"text/plain" })
    })]);
    flash(btn, "Copied");
  }catch(err){
    await navigator.clipboard.writeText(plain);
    flash(btn, "Copied as text");
  }
}
function flash(btn, said){ const was = btn.textContent; btn.textContent = said;
  setTimeout(() => btn.textContent = was, 1500); }

const COL = {
  date:    [0.000, 0.055],
  etime:   [0.055, 0.110],
  name:    [0.110, 0.250],   // Program Recipient
  conf:    [0.250, 0.320],

};

async function handle(files){
  files = files.filter(f => f.type === "application/pdf");
  if(!files.length) return;
  bookings = []; scanned = { pages:0, programs:[], mode:"" };
  const worker = await Tesseract.createWorker("eng");
  await worker.setParameters({ tessedit_pageseg_mode: "7" }); // one line per crop

  const docs = [];
  for(const f of files){
    const buf = new Uint8Array(await f.arrayBuffer());
    docs.push(await pdfjsLib.getDocument({ data: buf }).promise);
  }
  const total = docs.reduce((s,d) => s + d.numPages, 0);

  for(const doc of docs){
    for(let p=1; p<=doc.numPages; p++){
      progress(`Page ${scanned.pages+1} of ${total} — read on this device, nothing uploaded`, scanned.pages/total);
      await readPage(doc, p, worker);
      scanned.pages++;
    }
  }
  await worker.terminate();
  const how = scanned.mode === "text" ? "read straight from the PDF" : "read with OCR";
  progress(`Done — ${how}. ${bookings.length} booking${bookings.length===1?"":"s"} across your four programs.`, 1);
  render();
}

/* ---------------- clean a cell, then read it ---------------- */
function cellCanvas(page, box, pad = 5){
  const w = Math.ceil(box.x1 - box.x0 + pad*2), h = Math.ceil(box.y1 - box.y0 + pad*2);
  const c = document.createElement("canvas");
  c.width = w*2; c.height = h*2;                       // upscale — small type reads better
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(page, box.x0-pad, box.y0-pad, w, h, 0, 0, c.width, c.height);
  // grayscale + hard threshold: kills the dot-leaders and column rules
  const img = ctx.getImageData(0,0,c.width,c.height), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const v = 0.3*d[i] + 0.59*d[i+1] + 0.11*d[i+2];
    const b = v < 160 ? 0 : 255;
    d[i]=d[i+1]=d[i+2]=b;
  }
  ctx.putImageData(img,0,0);
  return c;
}
async function readCell(worker, page, box, chars){
  if(!box) return "";
  if(box.text != null) return box.text;        // the PDF told us — no need to read the pixels
  if(chars) await worker.setParameters({ tessedit_char_whitelist: chars });
  const { data } = await worker.recognize(cellCanvas(page, box));
  if(chars) await worker.setParameters({ tessedit_char_whitelist: "" });
  return (data.text || "").replace(/\s+/g," ").trim();
}

/* ---------------- read one page ---------------- */
async function readPage(doc, num, worker){
  const page = await doc.getPage(num);
  const tc = await page.getTextContent();

  // Two flavours of this report exist. The portrait export carries real text — read it straight.
  // The landscape one has boxes but no readable characters — that one gets rendered and OCR'd.
  const hasText = tc.items.filter(i => i.str && i.str.trim()).length >= 10;
  scanned.mode = hasText ? "text" : "ocr";

  const vp = page.getViewport({ scale: hasText ? 2 : SCALE, rotation: hasText ? 0 : 90 });
  const cv = document.createElement("canvas");
  cv.width = vp.width; cv.height = vp.height;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  const usable = tc.items.filter(i => i.width > 2 && i.height > 2 && (!hasText || (i.str && i.str.trim())));
  const runs = usable.map(it => {
    const [a,b,c,d,e,f] = it.transform;
    const la = Math.hypot(a,b), lc = Math.hypot(c,d);
    const ux = a/la, uy = b/la, vx = c/lc, vy = d/lc;
    const pts = [[e,f],
                 [e+ux*it.width, f+uy*it.width],
                 [e+vx*it.height, f+vy*it.height],
                 [e+ux*it.width+vx*it.height, f+uy*it.width+vy*it.height]]
                .map(([x,y]) => vp.convertToViewportPoint(x,y));
    const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
    const box = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
    if(hasText) box.text = it.str.trim();
    return box;
  });

  const W = vp.width;
  // program header bands: wide runs hugging the left margin
  const headers = runs.filter(r => r.x0/W < 0.06 && (r.x1-r.x0)/W > 0.15)
                      .sort((a,b) => a.y0 - b.y0);

  for(let h=0; h<headers.length; h++){
    const text = await readCell(worker, cv, headers[h]);
    const parts = text.split(">").map(s => s.trim());
    const def = PROGRAMS.find(p => p.match.test(parts[2] || ""));
    if(parts[2]) scanned.programs.push(parts[2]);
    if(!def) continue;

    const top = headers[h].y1, bottom = headers[h+1] ? headers[h+1].y0 : vp.height;
    const band = runs.filter(r => r.y0 > top - 4 && r.y1 < bottom + 4);

    // rows inside this section, grouped by vertical position
    const lines = [];
    band.forEach(r => {
      const mid = (r.y0+r.y1)/2;
      let ln = lines.find(l => Math.abs(l.mid - mid) < (r.y1-r.y0)*0.7);
      if(!ln){ ln = { mid, rs: [] }; lines.push(ln); }
      ln.rs.push(r);
    });
    lines.sort((a,b) => a.mid - b.mid);

    const progDate = (parts[3]||"").match(DATE)?.[0] || "";
    const progTime = (parts[4]||"").trim();

    for(let i=0; i<lines.length; i++){
      const cells = lines[i].rs;
      const dateBox = cells.find(r => inCol(r, W, "date"));
      if(!dateBox) continue;
      const dateTxt = await readCell(worker, cv, dateBox, "0123456789/");
      if(!DATE.test(dateTxt)) continue;   // not a booking row

      // some headers carry a label instead of a time ("TOUR A") — fall back to the row's Event Time cell
      let rowTime = progTime;
      if(minutes(rowTime) === 9999){
        const et = await readCell(worker, cv, cells.find(r => inCol(r, W, "etime")));
        const t = (et || "").match(/(\d{1,2}:\d{2})\s*(am|pm|AM|PM)/);
        if(t) rowTime = `${t[1]} ${t[2].toUpperCase()}`;
      }

      const b = { prog: def, date: progDate || dateTxt.match(DATE)[0], time: rowTime, suspect: [] };
      // Penguin: only the 10:30 slot is ours — skip every other Penguin time outright
      if(def.key === "penguin" && minutes(rowTime) !== 10*60 + 30) continue;
      b.include = minutes(rowTime) < 12*60;
      b.name    = await readCell(worker, cv, cells.find(r => inCol(r, W, "name")));
      b.conf    = await readCell(worker, cv, cells.find(r => inCol(r, W, "conf")));
      b.contact = await readCell(worker, cv, cells.find(r => inCol(r, W, "contact")));

      const phoneRaw = await readCell(worker, cv, cells.find(r => inCol(r, W, "phone")), "0123456789()- ");
      const m = phoneRaw.match(PHONE);
      b.phone = m ? `(${m[1]}) ${m[2]}-${m[3]}` : phoneRaw;
      if(!m) b.suspect.push("phone");

      // email — the run directly beneath the contact name
      const emailBox = lines[i+1]?.rs.find(r => inCol(r, W, "contact"));
      let em = emailBox ? await readCell(worker, cv, emailBox) : "";
      em = em.toLowerCase().replace(/\s*@\s*/, "@");
      if(!hasText){
        const hadSpace = /\s/.test(em);
        em = em.replace(/\s+/g, "_");            // OCR loses underscores — put them back
        if(hadSpace) b.suspect.push("email");
      }
      if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(em)) b.suspect.push("email");
      b.email = em;

      // party size — sum the Guest Count rows before the next booking
      let count = 0;
      for(let k=i+1; k<lines.length; k++){
        if(lines[k].rs.some(r => inCol(r, W, "date"))) break;   // next booking starts
        const lab = lines[k].rs.find(r => inCol(r, W, "gtype"));
        const val = lines[k].rs.find(r => inCol(r, W, "gcount"));
        if(!lab || !val) continue;
        const labTxt = await readCell(worker, cv, lab);
        if(!COUNT_LABEL.test(labTxt)) continue;                 // skips "Is Participant 48" or Taller?"
        count += parseInt(await readCell(worker, cv, val, "0123456789"), 10) || 0;
      }
      if(!count){
        const cb = cells.find(r => inCol(r, W, "count"));
        count = parseInt(await readCell(worker, cv, cb, "0123456789"), 10) || 0;
        if(!count) b.suspect.push("party size");
      }
      b.count = count;

      // a picture of the row, so the reading can be checked against the page
      const rowTop = Math.min(...cells.map(r=>r.y0)) - 8;
      const rowBot = (lines[i+1] ? Math.max(...lines[i+1].rs.map(r=>r.y1)) : Math.max(...cells.map(r=>r.y1))) + 8;
      const c = document.createElement("canvas");
      c.width = Math.round(W*0.62); c.height = Math.round(rowBot - rowTop);
      c.getContext("2d").drawImage(cv, 0, rowTop, c.width, c.height, 0, 0, c.width, c.height);
      b.crop = c.toDataURL("image/png");

      bookings.push(b);
    }
  }
}

  const out = $("#out");
  out.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = "Today's calls";
  out.appendChild(h);

  if(!bookings.length){
    const seen = [...new Set(scanned.programs)].join(" · ") || "nothing";
    out.insertAdjacentHTML("beforeend",
      `<div class="empty">No bookings found for your four programs.
       <div class="seen">Programs on the report: ${esc(seen)}</div></div>`);
    return;
  }

  bookings.sort((a,b) => minutes(a.time) - minutes(b.time));

  bookings.forEach(b => {
    const checkin = shift(b.time, b.prog.checkinOffset);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="head">
        <span class="time">${esc(b.time || "?")}</span>
        <span class="prog">${esc(b.prog.name)}</span>
        <span class="sub">check in ${esc(checkin)}</span>
        ${b.suspect.length ? `<span class="flag">Check ${esc([...new Set(b.suspect)].join(" · "))}</span>` : ""}
        <label class="inc"><input type="checkbox" data-a="inc" ${b.include?"checked":""}> on security email</label>
      </div>
      <div class="body">
        <div class="grid">
          <div><label>Guest</label><input type="text" data-f="name" value="${esc(b.name)}"></div>
          <div><label>Contact name</label><input type="text" data-f="contact" value="${esc(b.contact)}"></div>
          <div><label>Phone</label><input type="text" data-f="phone" value="${esc(b.phone)}"
               class="${b.suspect.includes("phone")?"suspect":""}"></div>
          <div><label>Email</label><input type="text" data-f="email" value="${esc(b.email)}"
               class="${b.suspect.includes("email")?"suspect":""}"></div>
          <div><label>Party</label><input type="text" data-f="count" value="${esc(String(b.count))}"
               class="${b.suspect.includes("party size")?"suspect":""}"></div>
          <div><label>Confirmation</label><input type="text" data-f="conf" value="${esc(b.conf)}"></div>
        </div>
        <div class="notes"><b>On the call</b><ul>${b.prog.notes(b).map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>
        <details class="crop"><summary>Compare against the report</summary><img src="${b.crop}" alt="this row on the report"></details>
        <pre class="mail"></pre>
      </div>
      <div class="acts">
        <button data-a="open">Open in Outlook</button>
        <button class="ghost" data-a="mail">Copy email</button>
        <button class="ghost" data-a="eml">Download .eml</button>
        <a class="call" href="tel:${b.phone.replace(/\D/g,"")}">Call ${esc(b.phone) || "—"}</a>
        <button class="ghost" data-a="peek">Show email</button>
      </div>`;

    card.querySelectorAll("input").forEach(inp => {
      inp.oninput = () => {
        b[inp.dataset.f] = inp.dataset.f === "count" ? (parseInt(inp.value,10)||0) : inp.value;
        inp.classList.remove("suspect");
      };
    });
    card.querySelector('[data-a="inc"]').onchange = e => { b.include = e.target.checked; paintSecurity(); };
    card.querySelector('[data-a="mail"]').onclick = e => {
      const html = fill(HTML_BODY[b.prog.key], b);
      copyRich(html, `${guestEmail(b).subject}\n\n${htmlToText(html)}`, e.target);
    };
    card.querySelector('[data-a="open"]').onclick = e => composeInOutlook(b, e.target);
    card.querySelector('[data-a="eml"]').onclick = () => downloadEml(
      `${b.prog.name} ${b.name || b.contact}`, b.email, guestEmail(b).subject, fill(HTML_BODY[b.prog.key], b));
    card.querySelector('[data-a="peek"]').onclick = e => {
      const pre = card.querySelector("pre.mail"), m = guestEmail(b);
      pre.textContent = `Subject: ${m.subject}\n\n${m.body}`;
      pre.classList.toggle("on");
      e.target.textContent = pre.classList.contains("on") ? "Hide email" : "Show email";
    };
    out.appendChild(card);
  });

  const sec = document.createElement("div");
  sec.className = "card";
  sec.innerHTML = `
    <div class="head"><span class="time">Roundup</span><span class="prog">Security team email</span>
      <span class="sub">to dispatchers + security managers</span></div>
    <div class="body"><pre class="mail on"></pre></div>
    <div class="acts">
      <button data-a="secopen">Open in Outlook</button>
      <button class="ghost" data-a="seccopy">Copy security email</button>
      <button class="ghost" data-a="seceml">Download .eml</button>
    </div>`;
  paintSecurity = () => sec.querySelector("pre").textContent = htmlToText(securityHtml());
  paintSecurity();
  const secSubject = () => `Specialty programs tomorrow ${bookings[0]?.date || ""}`;
  sec.querySelector('[data-a="seccopy"]').onclick = e =>
    copyRich(securityHtml(), htmlToText(securityHtml()), e.target);
  sec.querySelector('[data-a="secopen"]').onclick = async e => {
    await copyRich(securityHtml(), htmlToText(securityHtml()), e.target);
    openOutlook(SECURITY_TO, secSubject());
  };
  sec.querySelector('[data-a="seceml"]').onclick = () =>
    downloadEml("Security roundup", SECURITY_TO.replace(/;/g, ", "), secSubject(), securityHtml());
  out.appendChild(sec);

  const f = document.createElement("footer");
  f.textContent = "Read with OCR on this device. Nothing was uploaded. Fix anything highlighted before you send.";
  out.appendChild(f);
}

function copy(text, btn, said){
  navigator.clipboard.writeText(text).then(() => {
    const was = btn.textContent; btn.textContent = said;
    setTimeout(() => btn.textContent = was, 1400);
  });
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
